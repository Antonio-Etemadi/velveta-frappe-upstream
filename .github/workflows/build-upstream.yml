name: Build & Push Upstream Frappe Base Image

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

concurrency:
  group: build-velveta-frappe-upstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free hosted runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate immutable upstream release
        id: release
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 ./validate-upstream-pins.py
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: Antonio-Etemadi
          password: ${{ github.token }}

      - name: Build and push upstream Frappe image
        run: |
          set -euo pipefail
          docker buildx build \
            --network=host \
            --cache-from=type=registry,ref=ghcr.io/antonio-etemadi/velveta-frappe-upstream:buildcache \
            --cache-to=type=registry,ref=ghcr.io/antonio-etemadi/velveta-frappe-upstream:buildcache,mode=max \
            --push \
            --tag ghcr.io/antonio-etemadi/velveta-frappe-upstream:${{ github.sha }} \
            --tag ghcr.io/antonio-etemadi/velveta-frappe-upstream:v${{ steps.release.outputs.version }} \
            --tag ghcr.io/antonio-etemadi/velveta-frappe-upstream:latest \
            --file Containerfile \
            .
