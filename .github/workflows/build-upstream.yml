name: Build & Push Upstream Frappe Base Image

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

concurrency:
  group: build-velveta-frappe-upstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on:
      - self-hosted
      - dev
      - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable upstream release
        id: release
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 ./validate-upstream-pins.py
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          if [ -f /opt/velveta/infra-prod/.secrets/github_runner_pat ]; then
            cat /opt/velveta/infra-prod/.secrets/github_runner_pat | docker login ghcr.io -u Antonio-Etemadi --password-stdin
          else
            echo "${{ github.token }}" | docker login ghcr.io -u Antonio-Etemadi --password-stdin
          fi

      - name: Build and push upstream Frappe image
        run: |
          set -euo pipefail
          export SECRET_FLAG=""
          if [ -f /opt/velveta/infra-prod/.secrets/github_runner_pat ]; then
            SECRET_FLAG="--secret id=github_pat,src=/opt/velveta/infra-prod/.secrets/github_runner_pat"
          fi

          docker buildx build \
            --network=host \
            --cache-from=type=registry,ref=ghcr.io/antonio-etemadi/velveta-frappe-upstream:buildcache \
            --cache-to=type=registry,ref=ghcr.io/antonio-etemadi/velveta-frappe-upstream:buildcache,mode=max \
            --push \
            --tag ghcr.io/antonio-etemadi/velveta-frappe-upstream:${{ github.sha }} \
            --tag ghcr.io/antonio-etemadi/velveta-frappe-upstream:v${{ steps.release.outputs.version }} \
            --tag ghcr.io/antonio-etemadi/velveta-frappe-upstream:latest \
            --file Containerfile \
            ${SECRET_FLAG} \
            .
